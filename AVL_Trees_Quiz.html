<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVL Trees Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one centered column, one question at a time, a 20-tick progress strip on top. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --fg: #161b26;
  --muted: #586275;
  --line: #d9dfe9;
  --accent: #1f56c8;
  --accent-soft: #e5edfc;
  --good: #2b7a30;
  --good-soft: #e7f3e3;
  --bad: #c22f2f;
  --bad-soft: #fbe8e8;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b;
    --surface: #171c27;
    --fg: #e8ecf4;
    --muted: #9aa4b8;
    --line: #2b3345;
    --accent: #7ea4ff;
    --accent-soft: #1a2542;
    --good: #84d37f;
    --good-soft: #15281a;
    --bad: #ff8f8f;
    --bad-soft: #2f191c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b;
  --surface: #171c27;
  --fg: #e8ecf4;
  --muted: #9aa4b8;
  --line: #2b3345;
  --accent: #7ea4ff;
  --accent-soft: #1a2542;
  --good: #84d37f;
  --good-soft: #15281a;
  --bad: #ff8f8f;
  --bad-soft: #2f191c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
main { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; min-width: 0; }
header h1 {
  font-family: var(--font-display);
  font-size: clamp(1.7rem, 5vw, 2.3rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
  text-wrap: balance;
}
header p { margin: 0; color: var(--muted); }
.eyebrow {
  font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); font-weight: 600; margin: 0 0 8px;
}
.ticks { display: flex; gap: 3px; }
.tick { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.tick.now { background: var(--accent); }
.tick.ok { background: var(--good); }
.tick.no { background: var(--bad); }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px;
  min-width: 0;
}
.meta {
  display: flex; justify-content: space-between; gap: 12px;
  font-size: 0.85rem; color: var(--muted); margin-bottom: 12px;
  font-variant-numeric: tabular-nums;
}
.q {
  font-family: var(--font-display);
  font-size: clamp(1.15rem, 3.6vw, 1.4rem);
  line-height: 1.3;
  margin: 0 0 16px;
  font-weight: 500;
  text-wrap: pretty;
}
code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--accent-soft);
  padding: 1px 5px;
  border-radius: 4px;
  overflow-wrap: anywhere;
}
.tree { margin: 0 0 18px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; overflow-x: auto; }
.tree svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.tree figcaption { text-align: center; font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
.edge { stroke: var(--muted); stroke-width: 1.6; }
.pill { fill: var(--good-soft); stroke: var(--good); stroke-width: 1.8; }
.pilltxt { fill: var(--fg); font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: start;
  text-align: left; width: 100%;
  background: var(--surface); color: var(--fg);
  border: 1.5px solid var(--line); border-radius: 10px;
  padding: 12px 14px; font: inherit; cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.key {
  font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem;
  width: 28px; height: 28px; border-radius: 6px;
  display: grid; place-items: center;
  background: var(--bg); border: 1px solid var(--line); color: var(--muted);
}
.txt { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
.tag { font-size: 0.78rem; font-weight: 600; white-space: nowrap; padding-top: 4px; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .tag { color: var(--good); }
.opt.right .key { background: var(--good); color: var(--surface); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .tag { color: var(--bad); }
.opt.wrong .key { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt.dim { opacity: 0.6; }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); }
.fb strong { display: block; font-family: var(--font-display); margin-bottom: 4px; }
.fb.ok strong { color: var(--good); }
.fb.no strong { color: var(--bad); }
.fb p { margin: 0; }
.nav { display: flex; justify-content: flex-end; margin-top: 16px; }
.btn {
  font: inherit; font-weight: 600; cursor: pointer;
  background: var(--accent); color: var(--surface);
  border: 0; border-radius: 10px; padding: 11px 20px;
}
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.score {
  font-family: var(--font-display); font-size: clamp(2.4rem, 9vw, 3.6rem);
  line-height: 1; margin: 6px 0 4px; font-variant-numeric: tabular-nums;
}
.score small { font-size: 0.45em; color: var(--muted); }
.review { display: grid; gap: 12px; margin-top: 20px; }
.review h3 { font-family: var(--font-display); margin: 0; font-size: 1.05rem; }
.miss { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.miss p { margin: 6px 0 0; }
.miss .qq { font-weight: 600; margin: 0; }
.miss .you { color: var(--bad); }
.miss .ans { color: var(--good); }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.hint { font-size: 0.82rem; color: var(--muted); margin: 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 480px) { .card { padding: 16px; } .opt { grid-template-columns: 28px 1fr; } .tag { grid-column: 2; padding-top: 0; } }
</style>
</head>
<body>


<main>
  <header>
    <p class="eyebrow">Advanced Data Structures · Class 7 · Week 10</p>
    <h1>AVL Trees Quiz</h1>
    <p>20 multiple-choice questions on keeping a binary search tree short. You see the answer and a plain-language reason after every question.</p>
  </header>
  <div class="ticks" id="ticks" aria-hidden="true"></div>
  <section class="card" id="stage" aria-live="off"></section>
  <p class="hint" id="hint">Tip: press 1 to 4 to choose, Enter for the next question.</p>
</main>

<script>
/* Tree spec: [key, left, right]. Option text may contain HTML (author-controlled). */
var Q = [
  { q: "A plain binary search tree (BST) follows one rule. What is it?",
    o: ["Every node has exactly two children.",
        "Names in a node's left subtree come before it, and names in its right subtree come after it.",
        "The left and right subtrees always have the same height.",
        "Nodes are stored in the order they were inserted."],
    a: 1,
    why: "The BST rule is only about order. It says nothing about the shape or height of the tree. That gap is exactly why a plain BST can turn into a long, thin line." },

  { q: "You insert Garden, Gate, Home, Market, Park, Pond, Stall (already in sorted order) into a plain BST. How many nodes does a search for Stall read?",
    o: ["3", "4", "6", "7"],
    a: 3,
    why: "Each new name is bigger than everything stored, so it always becomes the right child. The tree is one line of 7 nodes, height 6 (that is n − 1). A search reads at most h + 1 = 7 nodes, which is no better than scanning a list." },

  { q: "What must be true at every node of an AVL tree?",
    o: ["The left and right subtrees have the same number of nodes.",
        "All leaves are at the same depth.",
        "The heights of the left and right subtrees differ by at most 1.",
        "Every node has two children."],
    a: 2,
    why: "The AVL rule is |h(L) − h(R)| ≤ 1 at every node. It does not need a perfect tree, only a tree that never leans much to one side. This one rule is what stops the one-sided line from forming." },

  { q: "Use h(None) = −1 for an empty child. A node has a left child of height 2 and no right child. What is its balance factor, bf = h(L) − h(R)?",
    o: ["1", "2", "3", "4"],
    a: 2,
    why: "bf = 2 − (−1) = 3. An empty child counts as −1 (so that a leaf works out to height 0). A balance factor of 3 is far outside {−1, 0, +1}, so this node is badly out of balance. If you got 2, you treated empty as 0 instead of −1." },

  { q: "Walking up from the new leaf Home, which node is the first one whose balance factor leaves {−1, 0, +1}?",
    o: ["Home", "Gate", "Garden", "None of them"],
    a: 2,
    t: ["Garden", null, ["Gate", null, ["Home"]]],
    cap: "Garden, then Gate, then Home, inserted in a plain BST.",
    why: "Home is a leaf: (−1) − (−1) = 0. Gate: (−1) − 0 = −1, still legal. Garden: (−1) − 1 = −2, the first illegal value. That node is the one you repair. You always repair the first broken node on the way up." },

  { q: "To prove AVL trees stay short, we count the fewest nodes N(h) an AVL tree of height h can have. Which formula gives it?",
    o: ["N(h) = 2 · N(h − 1)",
        "N(h) = 1 + N(h − 1) + N(h − 2)",
        "N(h) = N(h − 1) + N(h − 2)",
        "N(h) = 1 + 2 · N(h − 1)"],
    a: 1,
    why: "The sparsest legal tree has a root (the 1), one child of height h − 1, and the shortest sibling the rule allows, height h − 2. Using the smallest legal sibling is what makes the node count as small as possible." },

  { q: "N(0) = 1, N(1) = 2 and N(2) = 4. What is N(3), the fewest nodes in an AVL tree of height 3?",
    o: ["6", "7", "8", "9"],
    a: 1,
    why: "N(3) = 1 + N(2) + N(1) = 1 + 4 + 2 = 7. The sequence goes 1, 2, 4, 7, 12, 20, 33, so the smallest AVL tree of height 6 already has 33 nodes." },

  { q: "What does the N(h) argument finally tell us about an AVL tree with n nodes?",
    o: ["Its height is at most about 2 · log₂ n.",
        "It is always a perfectly full tree.",
        "Its height is exactly log₂ n.",
        "Every rotation takes O(log n) time."],
    a: 0,
    why: "N(h) at least doubles every two levels, so n ≥ 2^(h/2). Rearranged, h ≤ 2 · log₂ n. The bound is loose (it says 8 where the real minimum is 33), but loose is enough: height is O(log n), so search is O(log n)." },

  { q: "What does a rotation always preserve?",
    o: ["The height of every node",
        "The inorder order of the names",
        "Which node is the root",
        "The number of children each node has"],
    a: 1,
    why: "A rotation only moves a few links, so the sorted left-to-right (inorder) order never changes. That is why the BST rule still holds after every repair. Heights and the root do change, and that is the point." },

  { q: "A left rotation at z, where y is z's right child (with y's left subtree B). Which links change?",
    o: ["<code>z.right = y.left</code>, then <code>y.left = z</code>, then the caller puts y where z was",
        "Every node inside A, B and C is moved",
        "<code>z.left = y</code>, then <code>y.right = z</code>",
        "No links change, only the keys of z and y are swapped"],
    a: 0,
    why: "B moves over to be z's right child, z drops down to be y's left child, and y takes z's old spot. That is three links, and nothing inside A, B or C changes. There are no parent pointers, so the caller reconnects y." },

  { q: "z has balance factor −2, and its taller child y also leans right. Which case is this and what is the repair?",
    o: ["RR: one left rotation at z",
        "RR: one right rotation at z",
        "RL: right rotation at y, then left rotation at z",
        "LL: one right rotation at z"],
    a: 0,
    why: "A negative bf means the right side is too tall. The child also leans right, so the heavy side is a straight line (right-right). A straight line is fixed with one rotation the opposite way: a left rotation at z." },

  { q: "You insert Home, then Gate, then Garden into an empty AVL tree. What is the repair?",
    o: ["One left rotation at Home",
        "One right rotation at Home",
        "Left at Gate, then right at Home",
        "No repair is needed"],
    a: 1,
    why: "Home has bf +2 and Gate leans left too, so this is LL, the mirror of RR. One right rotation at Home makes Gate the root with Garden on the left and Home on the right." },

  { q: "You insert Gate, then Home, then Market into an empty AVL tree. After the repair, which name is the root?",
    o: ["Gate", "Home", "Market", "It depends on the order of insertion"],
    a: 1,
    t: ["Gate", null, ["Home", null, ["Market"]]],
    cap: "Gate, Home, Market inserted in order, before any repair.",
    why: "Gate has bf −2 and Home leans right, so this is RR. You rotate left at Gate, the broken node (not at Home). Home moves up as the root, with Gate on its left and Market on its right." },

  { q: "You insert Home, then Garden, then Gate. Which rotations repair it, in order?",
    o: ["Right rotation at Home only",
        "Right rotation at Home, then left rotation at Garden",
        "Left rotation at Garden, then right rotation at Home",
        "Left rotation at Home, then right rotation at Garden"],
    a: 2,
    t: ["Home", ["Garden", null, ["Gate"]], null],
    cap: "Home, then Garden, then Gate, before any repair.",
    why: "Home has bf +2, but its taller child Garden leans the other way (Gate is Garden's right child). That is the LR case. First straighten the bend with a left rotation at Garden, then do a right rotation at Home. Gate ends up as the root." },

  { q: "You insert Garden, then Home, then Gate. What is the first rotation?",
    o: ["Left rotation at Garden",
        "Right rotation at Home",
        "Left rotation at Home",
        "Right rotation at Garden"],
    a: 1,
    t: ["Garden", null, ["Home", ["Gate"], null]],
    cap: "Garden, then Home, then Gate, before any repair.",
    why: "Garden has bf −2, but its taller child Home leans left. That is the RL case. A single left rotation at Garden would just move the problem. So first rotate the child: a right rotation at Home. Then rotate left at Garden." },

  { q: "z is the broken node. How do you decide between one rotation and two?",
    o: ["Compare which way z leans with which way its taller child y leans: the same way means one rotation, the opposite way means two.",
        "Count the nodes in the tree: fewer than 10 means one rotation.",
        "Always do two rotations to be safe.",
        "Compare the alphabetical order of z and y."],
    a: 0,
    why: "Same direction (LL or RR) is a straight line, fixed by one rotation. Opposite directions (LR or RL) is a bend, so the child must be rotated first, then z. After an insertion, y's balance factor is +1 or −1, never 0." },

  { q: "In <code>rotate_left</code>, the code updates z's height first and then y's. Why that order?",
    o: ["After the rotation z is y's child, so y's new height depends on z's new height.",
        "Because z has the smaller key.",
        "Python requires the left node to be updated first.",
        "Heights do not need to be updated after a rotation."],
    a: 0,
    why: "Heights are updated bottom-up. After the rotation, z sits below y. If you updated y first, it would read z's old, stale height and store a wrong value." },

  { q: "Why does each AVL node store its own height?",
    o: ["So the BST rule holds.",
        "So rotations can be skipped.",
        "Because Python cannot compute heights recursively.",
        "So the balance factor is a constant-time read, instead of re-walking the subtree (Θ(n) on a one-sided tree)."],
    a: 3,
    why: "You can always recompute a height, but that visits every node below. On a one-sided tree that costs Θ(n). With heights stored, bf = h(L) − h(R) is just two lookups, and an insert only updates heights along one path." },

  { q: "After an insertion, you walk up and find the first node with |bf| = 2. Which statement is true?",
    o: ["You must keep rotating all the way up to the root.",
        "Repairing that node (one or two rotations) restores the subtree's old height, so nodes above stay legal and you can stop.",
        "You must rebuild the whole tree from scratch.",
        "You must fix every node below it as well."],
    a: 1,
    why: "The repair brings that subtree back to the height it had before the insert, so nothing above it sees a change. This stop-at-the-first-broken-node rule is for insertion only. Deletion may need repairs at several nodes along the path, though it still touches only O(log n) nodes." },

  { q: "You insert Garden, Gate, Home, Market, Park, Pond, Stall in sorted order into an AVL tree. What is the final height, and how many nodes does a search for Garden read?",
    o: ["Height 6, reads 7 nodes",
        "Height 2, reads 7 nodes",
        "Height 2, reads 3 nodes",
        "Height 3, reads 4 nodes"],
    a: 2,
    why: "Four left rotations (at Garden, Home, Gate and Park) give Market at the root, with Gate (Garden, Home) on the left and Pond (Park, Stall) on the right. Height 2 instead of 6. Searching for Garden reads Market, then Gate, then Garden: 3 nodes." }
];

/* ---- tiny tree drawing ---- */
function treeSVG(spec) {
  var nodes = [], i = 0, maxD = 0;
  function walk(t, d) {
    if (!t) return null;
    var l = walk(t[1], d + 1);
    var n = { k: t[0], d: d, x: i++, l: l, r: null };
    n.r = walk(t[2], d + 1);
    nodes.push(n);
    if (d > maxD) maxD = d;
    return n;
  }
  walk(spec, 0);
  var SX = 72, SY = 54;
  function px(n) { return 36 + n.x * SX; }
  function py(n) { return 24 + n.d * SY; }
  var W = i * SX, H = maxD * SY + 48, edges = "", pills = "";
  nodes.forEach(function (n) {
    [n.l, n.r].forEach(function (c) {
      if (c) edges += '<line class="edge" x1="' + px(n) + '" y1="' + py(n) + '" x2="' + px(c) + '" y2="' + py(c) + '"/>';
    });
  });
  nodes.forEach(function (n) {
    pills += '<rect class="pill" x="' + (px(n) - 32) + '" y="' + (py(n) - 15) + '" width="64" height="30" rx="15"/>' +
             '<text class="pilltxt" x="' + px(n) + '" y="' + py(n) + '">' + n.k + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="Binary tree diagram">' + edges + pills + '</svg>';
}

/* ---- quiz state ---- */
var order, picks, idx;
var stage = document.getElementById("stage");
var ticks = document.getElementById("ticks");
var hint = document.getElementById("hint");

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function score() {
  var s = 0;
  for (var i = 0; i < Q.length; i++) if (picks[i] === Q[i].a) s++;
  return s;
}
function drawTicks() {
  var h = "";
  for (var i = 0; i < Q.length; i++) {
    var c = "tick";
    if (picks[i] !== null) c += picks[i] === Q[i].a ? " ok" : " no";
    else if (i === idx) c += " now";
    h += '<div class="' + c + '"></div>';
  }
  ticks.innerHTML = h;
}
function start() {
  order = Q.map(function (q) { return shuffle(q.o.map(function (_, i) { return i; })); });
  picks = Q.map(function () { return null; });
  idx = 0;
  hint.hidden = false;
  renderQ();
}
function renderQ() {
  var q = Q[idx], o = order[idx], letters = "ABCD", h = "";
  h += '<div class="meta"><span>Question ' + (idx + 1) + ' of ' + Q.length + '</span><span>Score ' + score() + '</span></div>';
  h += '<h2 class="q">' + q.q + '</h2>';
  if (q.t) h += '<figure class="tree">' + treeSVG(q.t) + '<figcaption>' + q.cap + '</figcaption></figure>';
  h += '<div class="opts" role="group" aria-label="Answer choices">';
  o.forEach(function (oi, pos) {
    h += '<button class="opt" type="button" data-oi="' + oi + '"><span class="key">' + letters[pos] + '</span><span class="txt">' + q.o[oi] + '</span><span class="tag"></span></button>';
  });
  h += '</div><div class="fb" id="fb" hidden></div>';
  h += '<div class="nav"><button class="btn" id="next" type="button" hidden>' + (idx === Q.length - 1 ? "See results" : "Next question") + '</button></div>';
  stage.innerHTML = h;
  drawTicks();
}
function reveal(oi) {
  if (picks[idx] !== null) return;
  var q = Q[idx];
  picks[idx] = oi;
  var ok = oi === q.a;
  stage.querySelectorAll(".opt").forEach(function (b) {
    var bi = +b.getAttribute("data-oi");
    b.disabled = true;
    if (bi === q.a) { b.classList.add("right"); b.querySelector(".tag").textContent = "Correct answer"; }
    else if (bi === oi) { b.classList.add("wrong"); b.querySelector(".tag").textContent = "Your answer"; }
    else b.classList.add("dim");
  });
  var fb = document.getElementById("fb");
  fb.className = "fb " + (ok ? "ok" : "no");
  fb.innerHTML = "<strong>" + (ok ? "Correct." : "Not quite.") + "</strong><p>" + q.why + "</p>";
  fb.hidden = false;
  var nx = document.getElementById("next");
  nx.hidden = false;
  nx.focus({ preventScroll: true });
  nx.scrollIntoView({ block: "nearest", behavior: "smooth" });
  drawTicks();
  stage.querySelector(".meta span:last-child").textContent = "Score " + score();
}
function results() {
  var s = score(), n = Q.length, pct = Math.round(100 * s / n);
  var msg = s === n ? "Perfect. You can read balance factors and pick the right rotation every time."
          : s >= 16 ? "Strong result. Look at the few you missed below and the pattern will click."
          : s >= 11 ? "Good start. The missed questions below show where to look again."
          : "Keep going. Re-read the four cases (LL, RR, LR, RL) and try again.";
  var h = '<div class="meta"><span>Finished</span><span>' + pct + '%</span></div>';
  h += '<div class="score">' + s + '<small> / ' + n + '</small></div><p>' + msg + '</p>';
  var missed = [];
  for (var i = 0; i < n; i++) if (picks[i] !== Q[i].a) missed.push(i);
  if (missed.length) {
    h += '<div class="review"><h3>Review the ' + missed.length + ' you missed</h3>';
    missed.forEach(function (i) {
      var q = Q[i];
      h += '<div class="miss"><p class="qq">' + (i + 1) + '. ' + q.q + '</p>' +
           '<p class="you">Your answer: ' + q.o[picks[i]] + '</p>' +
           '<p class="ans">Correct answer: ' + q.o[q.a] + '</p>' +
           '<p>' + q.why + '</p></div>';
    });
    h += '</div>';
  }
  h += '<div class="row"><button class="btn" id="again" type="button">Try again</button></div>';
  stage.innerHTML = h;
  hint.hidden = true;
  drawTicks();
  window.scrollTo(0, 0);
}
function next() {
  if (picks[idx] === null) return;
  if (idx === Q.length - 1) { idx = Q.length; results(); return; }
  idx++;
  renderQ();
  window.scrollTo(0, 0);
}
stage.addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (!b) return;
  if (b.classList.contains("opt")) reveal(+b.getAttribute("data-oi"));
  else if (b.id === "next") next();
  else if (b.id === "again") start();
});
document.addEventListener("keydown", function (e) {
  if (idx >= Q.length) return;
  var k = e.key;
  if (picks[idx] === null && /^[1-4]$/.test(k)) {
    var oi = order[idx][+k - 1];
    if (oi !== undefined) reveal(oi);
  } else if (picks[idx] !== null && k === "Enter" && document.activeElement && document.activeElement.id !== "next") {
    next();
  }
});
start();
</script>
